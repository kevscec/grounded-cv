    reason: "internal table name"
  - text: "Senior Data Engineer"
    reason: "not a title held - see 02_POSITIONING section 2"
  - text: "Certified in Snowflake"
    reason: "not certified - see 01_IDENTITY_AND_FACTS section 4"

