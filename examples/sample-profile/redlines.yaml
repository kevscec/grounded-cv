candidate_name: "Robin Doe"

required_contact:
  - "robin.doe@example.com"
  - "linkedin.com/in/example-robin-doe"
  - "github.com/example-robin-doe"

page_limits:
  default: 2
  "*1page*": 1

forbidden:
