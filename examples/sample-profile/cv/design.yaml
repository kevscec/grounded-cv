# Shared design block for every CV variant.
#
# Rationale for each locked value: ../../docs/04-cv-methodology.md
# Usage:  rendercv render <cv>.yaml -o <output dir> -d design.yaml
#
# Two values here are not cosmetic. `show_top_note: false` prevents a date stamp rendering
# ahead of the candidate's name in the extracted text stream, where an ATS reads the name
# field. `alignment: left` avoids the uneven word spacing justification produces in narrow
# bullet columns.

design:
  theme: engineeringresumes

  page:
    size: us-letter
    top_margin: 0.6in
    bottom_margin: 0.6in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false      # CRITICAL: the default renders a date stamp ahead of the name
                              # in the extracted text stream. See research/01_ATS_MECHANICS.md

  colors:                     # pure black; no accent. See design/DECISIONS.md section 4
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)

  typography:
    line_spacing: 0.6em
    alignment: left           # overrides the theme's justified: no rivers, faster to scan
    date_and_location_column_alignment: right
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10pt
      name: 22pt
      headline: 11pt
      connections: 9.5pt
      section_titles: 1.2em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true

  links:
    underline: true
    show_external_link_icon: false

  header:
    alignment: center
    space_below_name: 0.25cm
    space_below_headline: 0.25cm
    space_below_connections: 0.4cm
    connections:
      phone_number_format: international   # a US employer needs the country code
      hyperlink: true
      show_icons: false                    # icons carry no text an ATS can read
      display_urls_instead_of_usernames: true
      separator: '|'
      space_between_connections: 0.35cm

  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.32cm
    space_below: 0.2cm

  sections:
    allow_page_break: true      # a section may span the page break
    space_between_regular_entries: 0.22cm
    space_between_text_based_entries: 0.12cm

  entries:
    date_and_location_width: 4.15cm
    allow_page_break: false     # but a single entry must not be split across pages
    highlights:
      bullet: •
      space_above: 0.08cm
      space_between_items: 0.08cm
      space_between_bullet_and_text: 0.3em

  templates:
    single_date: MONTH_ABBREVIATION YEAR      # -> "Jun 2023", the Month YYYY parser rule
    date_range: START_DATE – END_DATE
